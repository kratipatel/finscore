services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finscore-db
    environment:
      POSTGRES_USER: finscore
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: finscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
volumes:
  pgdata: